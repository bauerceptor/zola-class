# .github/workflows/deploy.yml — zola-class repo
# Builds and deploys the class site to its own GitHub Pages.
# URL: https://bauerceptor.github.io/zola-class/

name: Deploy Class Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No submodules — Neovim theme is vendored directly in themes/

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2   # keep in sync with main site

      - name: Build site
        run: zola build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
